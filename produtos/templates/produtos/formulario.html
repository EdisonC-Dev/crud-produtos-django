{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Produto</title>

    <link rel="stylesheet" href="{% static 'produtos/style.css' %}">
</head>

<body>

    <div class="container">

        <div class="formulario">

            <h1>Cadastrar produto</h1>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="botao salvar">
                    Salvar produto
                </button>

            </form>

            <a href="{% url 'listar_produtos' %}" class="voltar">
                ← Voltar à lista
            </a>

        </div>

    </div>

</body>

</html>
