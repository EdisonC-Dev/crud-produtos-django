<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Excluir produto</title>
</head>
<body>
    <h1>Excluir produto</h1>

    <p>Deseja excluir o produto "{{ produto.nome }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, excluir</button>
    </form>

    <a href="{% url 'listar_produtos' %}">Cancelar</a>
</body>
</html>
